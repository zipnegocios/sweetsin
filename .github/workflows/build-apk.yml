name: Build APK (staff)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL base de la API de apps/web que consumira la app
        required: true
        default: https://sweetsin.com.au

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate (typecheck y tests)
        run: |
          pnpm run typecheck
          pnpm --filter mobile run test
          pnpm --filter @workspace/domain run test

      - name: Guards
        run: |
          if [ -z "${API_BASE_URL// /}" ]; then
            echo "::error::api_base_url esta vacio"
            exit 1
          fi
          if grep -rn "APP_SECRET" apps/mobile/src; then
            echo "::error::APP_SECRET no debe aparecer en apps/mobile/src"
            exit 1
          fi

      - name: Set versionCode from run number
        run: |
          jq --argjson v "$GITHUB_RUN_NUMBER" '.expo.android.versionCode = $v' apps/mobile/app.json > "$RUNNER_TEMP/app.json"
          mv "$RUNNER_TEMP/app.json" apps/mobile/app.json
          jq '.expo.android' apps/mobile/app.json

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Add Android build-tools to PATH
        run: |
          BT_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          echo "Using build-tools at $BT_DIR"
          echo "$BT_DIR" >> "$GITHUB_PATH"

      - name: Verify release has no dev client
        run: |
          set -euo pipefail
          aapt2 dump xmltree --file AndroidManifest.xml apps/mobile/android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/manifest.txt"
          if grep -E 'expo\.modules\.(devlauncher|devmenu)' "$RUNNER_TEMP/manifest.txt"; then
            echo "::error::el APK de release incluye el cliente de desarrollo (expo-dev-client)"
            exit 1
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Align and sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SRC=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          zipalign -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/app-release.apk \
            "$RUNNER_TEMP/aligned.apk"

      - name: Inspect APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aapt2 dump badging dist/app-release.apk > "$RUNNER_TEMP/badging.txt"
          fail=0

          pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          vc=$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          label=$(sed -n "s/^application-label:'\(.*\)'$/\1/p" "$RUNNER_TEMP/badging.txt" | head -n1)
          echo "package=$pkg versionCode=$vc label=$label"

          [ "$pkg" = "au.com.sweetsin.staff" ] || { echo "::error::package name inesperado: $pkg"; fail=1; }
          [ "$vc" = "$GITHUB_RUN_NUMBER" ] || { echo "::error::versionCode $vc != $GITHUB_RUN_NUMBER"; fail=1; }
          [ "$label" = "Sweet Sin Staff" ] || { echo "::error::application-label inesperado: $label"; fail=1; }
          grep -q "^application-icon-" "$RUNNER_TEMP/badging.txt" || { echo "::error::no hay application-icon-* en el APK"; fail=1; }

          echo "--- uses-permission ---"
          grep "^uses-permission" "$RUNNER_TEMP/badging.txt" || true

          apksigner verify --print-certs dist/app-release.apk | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::el APK esta firmado con el certificado de debug"
            fail=1
          fi
          signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | tr -d ':' | tr 'A-F' 'a-f')
          release=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$signer" ] || [ "$signer" != "$release" ]; then
            echo "::error::el certificado firmante no coincide con el del keystore de release"
            fail=1
          fi

          exit $fail

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: sweetsin-staff-${{ github.run_number }}
          path: dist/app-release.apk
          if-no-files-found: error
